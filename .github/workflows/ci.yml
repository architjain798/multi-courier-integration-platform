name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: nothing here is worth paying for twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  static:
    name: Lint, format, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # Only the dependencies that ship. The docs generator pulls a vulnerable transitive tree that
      # no runtime path can reach, and failing the build over it teaches everyone to ignore the job.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit everything (advisory)
        run: npm audit --audit-level=moderate || true

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The OpenAPI document, the Postman collection and the SQL migrations are all derived from
      # code that a change can silently outdate. Regenerating and diffing is the only way a reviewer
      # can trust what is committed. Generation is deterministic, so a diff here is a real change.
      - name: Regenerate the API docs and the Postman collection
        run: npm run docs:generate

      - name: Regenerate the migrations
        run: npm run db:generate

      - name: Fail if anything drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run 'npm run docs:generate' and 'npm run db:generate', then commit the result."
            exit 1
          fi

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courier_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/courier_test
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # One run over both suites: the integration tests exercise most of src, so splitting them
      # would report a coverage number that describes neither.
      - name: Run the suite with coverage
        run: npm run test:coverage

      - name: Publish the coverage summary
        if: always()
        run: |
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs';
            const total = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const rows = Object.entries(total).map(([k, v]) => \`| \${k} | \${v.pct}% | \${v.covered}/\${v.total} |\`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['### Coverage', '', '| | % | covered |', '|---|---|---|', ...rows, ''].join('\n'));
          "

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Postman collection against the running stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # WireMock stands in for UrbaneBolt, so this proves the deliverable a reviewer actually runs
      # -- docker compose up, then import the collection -- without credentials or internet.
      - name: Start the stack offline
        run: |
          cp .env.ci .env
          docker compose up -d --build --wait

      - name: Wait for the courier stub
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/__admin/mappings > /dev/null && exit 0
            sleep 2
          done
          echo "::error::WireMock never came up"
          exit 1

      - name: Readiness reports every dependency up
        run: |
          curl -sf http://localhost:3000/health/ready | tee /dev/stderr | grep -q '"status":"ready"'

      - name: Run the Postman collection
        run: npx --yes newman@6 run postman/multi-courier.postman_collection.json --color off

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [static, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # A pull request proves the image still builds; only main publishes one.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
